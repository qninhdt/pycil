# Product policy, never credentials. Units preserve the previous integer scale.
plans:
  FREE:
    monthly_allowance_units: 1000000
    features: [ASSISTANT]
  PRO:
    monthly_allowance_units: 10000000
    features: [ASSISTANT, ADVANCED_GRADING]
account:
  defaults:
    locale: en
    timezone: UTC
    translation_language: vi
  locales: [en, vi]
  translation_languages: [en, vi]
learning:
  defaults:
    question_types:
      [
        DEFINITION_TO_WORD,
        CONTEXT_TO_WORD,
        CLOZE_TO_WORD,
        WORD_TO_DEFINITION,
        WORD_TO_USAGE,
        DIALOGUE_COMPLETION,
        MEANING_IN_CONTEXT,
      ]
    formats: [SINGLE_CHOICE]
    questions_per_sense: 3
    max_sense_count: 10
    show_explanations: true
  limits:
    min_questions_per_sense: 1
    max_questions_per_sense: 7
    max_questions_per_prepare: 100
    candidate_read_batch_size: 100
    max_answer_chars: 8000
    max_review_batch: 100
    max_summary_nodes: 50
    max_activity_days: 366
    max_schedule_days: 30
  pair_levels:
    DEFINITION_TO_WORD: { SINGLE_CHOICE: 1, SINGLE_WORD: 3 }
    CONTEXT_TO_WORD: { SINGLE_CHOICE: 2, SINGLE_WORD: 3 }
    CLOZE_TO_WORD: { SINGLE_CHOICE: 2, SINGLE_WORD: 3 }
    WORD_TO_DEFINITION: { SINGLE_CHOICE: 1, SHORT_ANSWER: 4 }
    WORD_TO_USAGE: { SINGLE_CHOICE: 2, SHORT_ANSWER: 4 }
    DIALOGUE_COMPLETION: { SINGLE_CHOICE: 2 }
    MEANING_IN_CONTEXT: { SINGLE_CHOICE: 2 }
  format_mix:
    NEW: { max_single_word: 0, max_short_answer: 0 }
    AGAIN: { max_single_word: 0, max_short_answer: 0 }
    HARD: { max_single_word: 1, max_short_answer: 0 }
    GOOD: { max_single_word: 1, max_short_answer: 1 }
    EASY: { max_single_word: 1, max_short_answer: 1 }
  fsrs:
    desired_retention: 0.9
    max_interval_days: 365
generation:
  questions_per_type: 8
  distractor_count: 3
  examples_per_sense: 5
  worker:
    poll_interval_seconds: 1
    attempt_timeout_seconds: 600
    max_attempts: 3
    retry_delay_seconds: 5
assistant:
  default_model: openai/gpt-6-luna
  default_effort: medium
  llm_timeout_seconds: 180
  max_tool_calls: 32
  max_message_chars: 8000
  max_context_messages: 100
  max_images: 4
  max_image_bytes: 10000000
  starts_per_minute: 20
  retention_days: 30
  purge_interval_seconds: 3600
  purge_batch_size: 100
models:
  # OpenRouter catalog checked 2026-10-08; units are USD per million tokens.
  - id: openai/gpt-6-luna
    name: GPT-6 Luna
    vision: true
    efforts: [low, medium, high]
    max_output_tokens: 8192
    input_units_per_token: "0.10"
    output_units_per_token: "0.50"
    cached_read_units_per_token: "0.01"
    cache_write_units_per_token: "0.125"
  - id: google/gemini-3.8-flash
    name: Gemini 3.8 Flash
    vision: true
    efforts: [low, medium, high]
    max_output_tokens: 8192
    input_units_per_token: "0.75"
    output_units_per_token: "3.75"
    cached_read_units_per_token: "0.075"
    cache_write_units_per_token: "0.0416666666666667"
providers:
  lexi:
    model: openai/gpt-6-luna
    timeout_seconds: 120
    max_completion_tokens: 16384
    max_retries: 2
    structured_outputs: true
    reasoning_effort: medium
    temperature: null
    decision_model: typesafe/jev-1.13
    decision_fallback_model: openai/gpt-6-luna
    decision_threshold: 0.8
    decision_mode: LLM_FALLBACK
library:
  max_depth: 20
  page_size: 50
  max_senses_per_deck: 1000
  max_children_per_folder: 500
  max_owned_nodes: 2000
  max_owned_memberships: 100000
  max_scope_nodes: 10000
  max_scope_memberships: 200000
  statement_timeout_ms: 3000
  scope_timeout_seconds: 5
cache:
  actor_ttl_seconds: 60
  deck_ttl_seconds: 60
  max_entries: 1000
  max_value_bytes: 65536
projections:
  max_page_size: 100
  max_summary_memberships: 200000
  max_word_ids: 30
  max_word_senses: 500
  max_context_senses: 100
  inline_sources: 5
  inline_examples: 2
  max_query_chars: 200
http:
  max_body_bytes: 15000000
