# Canonical non-secret policy. Backend changes require process restart.
# Flat module-centric configuration: account, library, study, vocabulary, assistant, jobs, system.

account:
  default_locale: en
  default_timezone: UTC
  default_translation_language: vi
  auto_approve_assistant: false
  locales: [en, vi]
  translation_languages: [en, vi]
  plans:
    free:
      monthly_allowance_units: 1000000
      features: [assistant]
    pro:
      monthly_allowance_units: 10000000
      features: [assistant, advanced_grading]
  profile_timeout_seconds: 15
  jwks_timeout_seconds: 30
  jwks_lifespan_seconds: 300

library:
  max_depth: 20
  max_senses_per_deck: 1000
  max_children_per_folder: 500
  max_owned_nodes: 2000
  max_owned_memberships: 100000
  max_scope_nodes: 10000
  max_scope_memberships: 200000
  page_size: 50
  max_page_size: 100
  inline_sources: 5
  inline_examples: 2
  max_query_chars: 200
  max_summary_memberships: 200000
  statement_timeout_ms: 3000
  scope_timeout_seconds: 5

study:
  grading:
    decision_threshold: 0.5
  defaults:
    question_types:
      [
        definition_to_word,
        context_to_word,
        cloze_to_word,
        word_to_definition,
        word_to_usage,
        dialogue_completion,
        meaning_in_context,
        sentence_rewrite,
      ]
    formats: [single_choice]
    questions_per_sense: 2
    max_sense_count: 10
  limits:
    min_questions_per_sense: 1
    max_questions_per_sense: 3
    max_questions_per_prepare: 60
    max_sense_count: 20
    max_answer_chars: 8000
    max_review_batch: 60
    max_summary_nodes: 50
    max_activity_days: 366
    max_schedule_days: 30
  pair_levels:
    definition_to_word:
      single_choice: 1
      single_word: 3
    context_to_word:
      single_choice: 2
      single_word: 3
    cloze_to_word:
      single_choice: 2
      single_word: 3
    word_to_definition:
      single_choice: 1
      short_answer: 4
    word_to_usage:
      single_choice: 2
      short_answer: 4
    dialogue_completion:
      single_choice: 2
    meaning_in_context:
      single_choice: 2
    sentence_rewrite:
      single_choice: 2
      short_answer: 5
  mastery:
    initial_elo: 600
    k_elo: 32
    horizon_hours: 24
    level_thresholds: [800, 1000, 1200, 1400]
    opponent_elo: [600, 800, 1000, 1200, 1400]
    policy_version: 1
  fsrs:
    desired_retention: 0.9
    max_interval_days: 365
    initial_stability: 1
    initial_difficulty: 5
  artifacts:
    correct_count: 1
    distractor_count: 3
    batch_size: 8

vocabulary:
  search:
    max_query_chars: 256
    default_limit: 30
  preview:
    max_word_ids: 30
    max_word_senses: 500
    max_context_senses: 100
    inline_sources: 5
    inline_examples: 2
  generation:
    examples_per_sense: 5
  search_runtime:
    rebuild_batch_size: 2000
    writer_heap_bytes: 15000000
    writer_threads: 1
    poll_interval_seconds: 2
    ownership_retry_seconds: 2
    retry_jitter_seconds: 0.2
    revision_batch_size: 100
    publication_timeout_seconds: 30
    startup_timeout_seconds: 300
    progress_timeout_seconds: 30
  enrichment_batch_size: 8
  provider:
    model: openai/gpt-6.1-sol
    timeout_seconds: 120
    max_completion_tokens: 16384
    max_retries: 2
    structured_outputs: true
    reasoning_effort: medium
    temperature: null
    decision_model: typesafe/jev-1.13
    retry_min_seconds: 0.5
    retry_max_seconds: 8

assistant:
  defaults:
    model: openai/gpt-6-luna
    effort: medium
  limits:
    max_tool_calls: 32
    max_message_chars: 8000
    max_context_messages: 100
    max_images: 4
    max_image_bytes: 10000000
  llm_timeout_seconds: 180
  lease_ttl_seconds: 30
  starts_per_minute: 20
  models:
    - id: openai/gpt-6-luna
      name: GPT-6 Luna
      vision: true
      efforts: [low, medium, high]
      max_output_tokens: 8192
      input_units_per_token: "0.10"
      output_units_per_token: "0.50"
      cached_read_units_per_token: "0.01"
      cache_write_units_per_token: "0.125"
    - id: openai/gpt-6.1-sol
      name: GPT-6.1 Sol
      vision: true
      efforts: [low, medium, high]
      max_output_tokens: 8192
      input_units_per_token: "2.00"
      output_units_per_token: "10.00"
      cached_read_units_per_token: "0.10"
      cache_write_units_per_token: "2.50"
    - id: google/gemini-3.8-flash
      name: Gemini 3.8 Flash
      vision: true
      efforts: [low, medium, high]
      max_output_tokens: 8192
      input_units_per_token: "0.75"
      output_units_per_token: "3.75"
      cached_read_units_per_token: "0.075"
      cache_write_units_per_token: "0.0416666666666667"

jobs:
  timeout_seconds: 300
  lock_timeout_seconds: 330
  result_ttl_seconds: 86400

system:
  caches:
    user_id:
      ttl_seconds: 60
      max_entries: 10000
    words:
      ttl_seconds: 30
      max_entries: 5000
    senses:
      ttl_seconds: 30
      max_entries: 20000
    artifacts:
      ttl_seconds: 30
      max_entries: 2048
  database:
    application_pool:
      connect_timeout_seconds: 60
      size: 5
      max_overflow: 0
      timeout_seconds: 2
    checkpoint_pool:
      timeout_seconds: 30
      startup_timeout_seconds: 30
      min_size: 1
      max_size: 3
  redis:
    connect_timeout_seconds: 5
    operation_timeout_seconds: 5
    max_connections: 16
  http:
    max_body_bytes: 15000000
    client_timeout_seconds: 5
  health:
    timeout_seconds: 2
    redis_timeout_seconds: 0.25
  lifecycle:
    cleanup_timeout_seconds: 40
  telemetry:
    traces:
      max_queue_size: 2048
      max_export_batch_size: 256
      schedule_delay_seconds: 5
      export_timeout_seconds: 2
    metrics:
      export_interval_seconds: 15
      export_timeout_seconds: 2
      shutdown_timeout_seconds: 5
