apiVersion: 1
groups:
- orgId: 1
  name: Pycil VPS
  folder: Pycil VPS
  interval: 30s
  rules:
  - uid: vps-api-errors
    title: API 5xx above 2% (at least 50 requests/5m)
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: pycil:api_errors:condition{env="vps"}
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        datasource:
          type: prometheus
          uid: prometheus
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            type: last
            params: []
        datasource:
          type: __expr__
          uid: __expr__
    noDataState: NoData
    execErrState: Error
    for: 5m
    isPaused: false
    annotations:
      summary: API 5xx above 2% (at least 50 requests/5m)
      description: Inspect HTTP status/route, then correlate the exemplar with Tempo and Loki. Roll back only a
        schema-compatible image.
      __dashboardUid__: pycil-api
      __panelId__: '2'
      runbook: infra/vps/README.md
    labels:
      env: vps
      severity: warning
      scope: vps-only
