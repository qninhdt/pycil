auth_enabled: false
server:
  http_listen_port: 3100
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
ingester:
  wal:
    dir: /loki/wal
    replay_memory_ceiling: 64MB
  chunk_target_size: 262144
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
limits_config:
  retention_period: 168h
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_parallelism: 2
  tsdb_max_query_parallelism: 2
  max_query_series: 100
  max_entries_limit_per_query: 1000
  query_timeout: 15s
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 16
querier:
  max_concurrent: 2
analytics:
  reporting_enabled: false
