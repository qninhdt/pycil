# Isolated WAL-G rehearsal: a throwaway PostgreSQL cluster archiving to a local
# MinIO, plus a restore target. Nothing here touches the deployed stack.
#
# Deliberately isolated in three ways: it publishes no port except a loopback
# debug bind, it keeps its data in project-named volumes rather than a host path,
# and it refuses to start if pointed at the deployment's own port. The last one is
# the important one — a rehearsal that silently targets production is worse than
# no rehearsal, because it produces a green result for the wrong system.
#
# Usage:
#   docker compose -f infra/postgres-walg/docker-compose.walg-rehearsal.yml up -d
#   ./scripts/rehearse-walg-restore.sh
#   docker compose -f infra/postgres-walg/docker-compose.walg-rehearsal.yml down -v
name: pycil-walg-rehearsal

x-walg-env: &walg-env
  WALG_S3_PREFIX: s3://pycil-backups/rehearsal
  AWS_ACCESS_KEY_ID: rehearsal
  AWS_SECRET_ACCESS_KEY: rehearsal-secret
  AWS_ENDPOINT: http://minio:9000
  AWS_REGION: us-east-1
  # MinIO serves buckets as path segments rather than subdomains.
  AWS_S3_FORCE_PATH_STYLE: "true"
  # WAL-G otherwise reads the OS user, which in this image is not a database role.
  PGUSER: pycil
  PGDATABASE: pycil
  PGHOST: /var/run/postgresql

services:
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: rehearsal
      MINIO_ROOT_PASSWORD: rehearsal-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set r http://minio:9000 rehearsal rehearsal-secret
        mc mb --ignore-existing r/pycil-backups
        echo "[minio] bucket ready"

  # The source cluster: the one that is backed up.
  postgres:
    build:
      context: .
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: pycil
      POSTGRES_PASSWORD: rehearsal-only
      POSTGRES_DB: pycil
      POSTGRES_INITDB_ARGS: "--data-checksums"
      <<: *walg-env
    # Loopback only, on a port reserved for this rehearsal. The deployed stack
    # uses 5434 and 5433; nothing here may collide with either.
    ports:
      - "127.0.0.1:5499:5432"
    # Archive settings as `-c` flags, not a `config_file=` override. Pointing
    # `config_file` at a file of our own REPLACES the stock postgresql.conf rather
    # than extending it, which silently dropped `listen_addresses = '*'` and left
    # the container listening on its own loopback only — reachable from inside the
    # compose network and resetting every connection from the host. These flags
    # add to the generated configuration instead.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=60
      - -c
      - wal_level=replica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pycil -d pycil"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - rehearsal_pgdata:/var/lib/postgresql/data

  # The restore target: fresh empty PGDATA, never the source's volume. It only
  # exists while a restore is being rehearsed, so it has no healthcheck and no
  # dependent service.
  postgres-restore:
    build:
      context: .
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: pycil
      POSTGRES_PASSWORD: rehearsal-only
      POSTGRES_DB: pycil
      <<: *walg-env
    profiles: ["restore"]
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["sleep", "infinity"]
    volumes:
      - rehearsal_restore_pgdata:/var/lib/postgresql/data

volumes:
  rehearsal_pgdata:
  rehearsal_restore_pgdata:
