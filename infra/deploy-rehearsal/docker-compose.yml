# Sandbox stand-in for the real stack. No ports are published, the images are tiny,
# and the project name is unique, so this cannot collide with a running deployment.
name: pycil-deploy-rehearsal

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 10

  migrate:
    image: alpine:3.21
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "${MIGRATE_COMMAND:-echo migrated}"]

  api:
    image: alpine:3.21
    command: ["sh", "-c", "${API_COMMAND:-sleep 3600}"]
    healthcheck:
      test: ["CMD-SHELL", "${API_HEALTHCHECK:-exit 0}"]
      interval: 2s
      timeout: 2s
      retries: 2

  caddy:
    image: caddy:2-alpine
    command: ["sleep", "3600"]
    volumes:
      # deploy.sh validates the Caddyfile at this exact path inside the container.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
