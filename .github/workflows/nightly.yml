name: Nightly

# Expensive / real-LLM work kept OFF the PR gate. Runs on a schedule and via
# manual dispatch only — NEVER on pull_request/pull_request_target, so no
# deployment credential is exposed to fork PRs.
on:
  schedule:
    # 03:17 UTC daily (off the :00 stampede).
    - cron: "17 3 * * *"
  workflow_dispatch: {}

# Least privilege for the whole workflow; jobs widen only if they must.
permissions:
  contents: read

jobs:
  test-api:
    # Same full suite as the PR gate (test.yml test-api) — run nightly too so a
    # flaky/slow drift shows up even without a PR open.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pycil
          POSTGRES_PASSWORD: pycil
          POSTGRES_DB: pycil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dev deps
        working-directory: apps/api
        run: uv sync --extra dev
      - name: Run pytest with coverage
        working-directory: apps/api
        env:
          TEST_DB_URL: postgresql+asyncpg://pycil:pycil@localhost:5432/pycil_test
        run: |
          uv run pytest --cov=pycil --cov-report=xml --cov-report=term-missing -q
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-api
          path: apps/api/coverage.xml
