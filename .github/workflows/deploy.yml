name: Deploy

# Gated on the test workflow rather than on the push itself. Both used to fire on
# `push: main` independently, so a commit that broke the API suite still built and
# pushed images — the deploy did not wait for, or look at, the test result.
#
# Referenced by workflow NAME (`name:` in test.yml), not by filename.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build:
    # `completed` covers failure and cancellation too, so the conclusion has to be
    # checked explicitly; without this the gate would pass on a red suite.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      api_digest: ${{ steps.build-api.outputs.digest }}
      worker_digest: ${{ steps.build-worker.outputs.digest }}
      web_digest: ${{ steps.build-web.outputs.digest }}
    steps:
      # A `workflow_run` event checks out the default branch and sets GITHUB_SHA to
      # its tip, which is not necessarily the commit that was tested. Both the
      # checkout and the image tag are pinned to the tested revision so the image
      # contains what the suite actually ran against.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve image tag
        id: meta
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "image_tag=${TESTED_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Three images until web leaves Compose. The design makes web a Vercel build,
      # but `docker-compose.yml` still runs a `web` service and `scripts/deploy.sh`
      # requires a `WEB_IMAGE` digest, so dropping this now would break the deploy
      # path while nothing had replaced it. The image leaves with the container.
      - name: Build & push api
        id: build-api
        uses: docker/build-push-action@v5
        with:
          # Repo-root context so the worker image can install the API package.
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.image_tag }}

      - name: Build & push worker
        id: build-worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker:${{ steps.meta.outputs.image_tag }}

      - name: Build & push web
        id: build-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ steps.meta.outputs.image_tag }}

      - name: Deploy hint
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          API_DIGEST: ${{ steps.build-api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.build-worker.outputs.digest }}
          WEB_DIGEST: ${{ steps.build-web.outputs.digest }}
        run: |
          echo "Images pushed to ghcr at tag ${{ steps.meta.outputs.image_tag }}."
          echo "Tested revision: ${TESTED_SHA}"
          echo "Deploy exact digests on the host:"
          echo "API_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api@${API_DIGEST}"
          echo "WORKER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker@${WORKER_DIGEST}"
          echo "WEB_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web@${WEB_DIGEST}"
          echo "scripts/deploy.sh applies them migration-then-swap; CI does not SSH."
