name: Deploy

# Gated on the test workflow rather than on the push itself. Both used to fire on
# `push: main` independently, so a commit that broke the API suite still built and
# pushed images — the deploy did not wait for, or look at, the test result.
#
# Referenced by workflow NAME (`name:` in test.yml), not by filename.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build:
    # `completed` covers failure and cancellation too, so the conclusion has to be
    # checked explicitly; without this the gate would pass on a red suite.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      api_digest: ${{ steps.build-api.outputs.digest }}
    steps:
      # A `workflow_run` event checks out the default branch and sets GITHUB_SHA to
      # its tip, which is not necessarily the commit that was tested. Both the
      # checkout and the image tag are pinned to the tested revision so the image
      # contains what the suite actually ran against.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve image tag
        id: meta
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "image_tag=${TESTED_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image for API, generation worker and explicit migration gate.
      - name: Build & push api
        id: build-api
        uses: docker/build-push-action@v7.4.0
        with:
          # Repo-root context for the shared backend package and policy config.
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.image_tag }}

      - name: Deploy hint
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          API_DIGEST: ${{ steps.build-api.outputs.digest }}
        run: |
          echo "Images pushed to ghcr at tag ${{ steps.meta.outputs.image_tag }}."
          echo "Tested revision: ${TESTED_SHA}"
          echo "Deploy exact digests on the host:"
          echo "API_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api@${API_DIGEST}"
          echo "Deployment requires separate operator approval and a verified full database backup."
          echo "Apply the explicit migration gate before replacing both API and worker."
