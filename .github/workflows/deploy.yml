name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  caddy-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Caddyfile
        run: |
          docker run --rm -e DOMAIN=example.com -e CADDY_ACME_EMAIL=admin@example.com \
            -v "${{ github.workspace }}:/etc/caddy" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  build:
    needs: caddy-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push pycil-core
        uses: docker/build-push-action@v5
        with:
          # Repo-root context: the Dockerfile COPYs packages/shared-py, which
          # only resolves from root (matches docker-compose.yml build config).
          context: .
          file: apps/pycil-core/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-core:${{ steps.meta.outputs.image_tag }}

      - name: Build & push worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker:${{ steps.meta.outputs.image_tag }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate prod compose (exact base-only invocation deploy uses)
        env:
          # Dummy values so `docker compose config` interpolates cleanly; this
          # only validates structure, it does not run anything.
          DATABASE_URL_ASYNC: postgresql+asyncpg://u:p@postgres:5432/pycil
          REDIS_URL: redis://redis:6379/0
          ALLOWED_ORIGINS: https://example.com
          SESSION_COOKIE_NAME: __Secure-pycil-session
          AUTH_JWT_SECRET: x
          INTERNAL_API_SECRET: x
          OPENROUTER_API_KEY: x
          OPENROUTER_MODEL: openai/gpt-4o-mini
          OPENROUTER_BUDGET_DAILY_USD: "20"
          DOMAIN: example.com
          CADDY_ACME_EMAIL: admin@example.com
          RESTIC_REPOSITORY: ""
        run: docker compose -f docker-compose.yml config >/dev/null

      - name: Sync compose file to host (repo is authoritative)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/pycil

      - name: Deploy via SSH (migration-then-swap)
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ github.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,REGISTRY,IMAGE_PREFIX
          script: |
            set -euo pipefail
            cd /opt/pycil
            # Source .env so $POSTGRES_USER / $POSTGRES_DB are available to pg_dump.
            set -a
            . ./.env
            set +a
            export CORE_IMAGE="${REGISTRY}/${IMAGE_PREFIX}-core:${IMAGE_TAG}"
            export WORKER_IMAGE="${REGISTRY}/${IMAGE_PREFIX}-worker:${IMAGE_TAG}"

            ts=$(date +%s)
            mkdir -p /var/backups/pycil
            docker compose exec -T postgres pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB" \
              > /var/backups/pycil/pre-deploy-${ts}.sql
            ls -1t /var/backups/pycil/pre-deploy-*.sql | tail -n +6 | xargs -r rm

            docker compose pull
            # Run migration in NEW image BEFORE swapping app containers.
            if ! docker compose run --rm pycil-core alembic upgrade head; then
              echo "migration failed; aborting deploy. old containers untouched."
              exit 1
            fi
            docker compose up -d

            healthy=0
            for i in $(seq 1 30); do
              if docker compose exec -T pycil-core \
                   python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()" \
                   >/dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 2
            done
            if [ "$healthy" -ne 1 ]; then
              echo "pycil-core failed health check after 60s"
              exit 1
            fi

            # Gate the WORKER too: it shares the schema and runs the kept
            # translate/TTS jobs. Without this a migration that breaks the
            # worker deploys "green" while the worker crash-loops. Wait on the
            # compose healthcheck (redis ping in-image).
            worker_ok=0
            for i in $(seq 1 30); do
              status="$(docker compose ps --format '{{.Health}}' worker 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                worker_ok=1
                break
              fi
              # Bail early if the worker exited rather than just being slow.
              state="$(docker compose ps --format '{{.State}}' worker 2>/dev/null || true)"
              if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
                echo "worker container is $state — deploy unhealthy"
                docker compose logs --tail=50 worker || true
                exit 1
              fi
              sleep 2
            done
            if [ "$worker_ok" -ne 1 ]; then
              echo "worker failed health check after 60s"
              docker compose logs --tail=50 worker || true
              exit 1
            fi
