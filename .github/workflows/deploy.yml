name: Deploy

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pycil-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/test.yml'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      ECR_REPOSITORY: 045148955662.dkr.ecr.ap-southeast-1.amazonaws.com/pycil-api
      GHCR_REPOSITORY: ghcr.io/qninhdt/pycil-api
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Set temporary artifact and credential directories
        run: |
          install -d -m 700 "$RUNNER_TEMP/registry-auth"
          echo "RELEASE_DIR=$RUNNER_TEMP/release" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/registry-auth" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Download only this trusted test run's image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: api-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install verified crane
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz \
            -o "$RUNNER_TEMP/crane.tar.gz"
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/crane-bin"
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP/crane-bin" crane
          echo "$RUNNER_TEMP/crane-bin" >> "$GITHUB_PATH"
      - name: Validate scanned archive before credentials
        run: scripts/publish-image.sh verify
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '045148955662'
          role-session-name: pycil-publish-${{ github.run_id }}
          role-duration-seconds: 900
          unset-current-credentials: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned artifact and verify both registries
        run: scripts/publish-image.sh publish
      - name: Release manifest and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
          path: |
            ${{ env.RELEASE_DIR }}/release.json
            ${{ env.RELEASE_DIR }}/sbom.cdx.json
            ${{ env.RELEASE_DIR }}/scan.json
            ${{ env.RELEASE_DIR }}/trivy-exceptions.yaml
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary registry credentials
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
