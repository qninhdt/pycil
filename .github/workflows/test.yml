name: Backend Tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [pycil-core, worker]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pycil
          POSTGRES_PASSWORD: pycil
          POSTGRES_DB: pycil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev deps for ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: uv sync --extra dev

      - name: Run pytest with coverage
        working-directory: apps/${{ matrix.app }}
        env:
          DATABASE_URL: postgresql+asyncpg://pycil:pycil@localhost:5432/pycil_test
          REDIS_URL: redis://localhost:6379/0
          AUTH_JWT_SECRET: ci-fake-secret
          INTERNAL_API_SECRET: ci-fake-internal
          OPENROUTER_API_KEY: ci-fake
          ALLOWED_ORIGINS: http://localhost:3000
        run: |
          if [ "${{ matrix.app }}" = "pycil-core" ]; then
            uv run pytest --cov=pycil_core --cov-fail-under=70 \
              --cov-report=xml -q --maxfail=5
          else
            uv run pytest --cov=worker --cov-fail-under=70 \
              --cov-report=xml -q --maxfail=5
          fi

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: apps/${{ matrix.app }}/coverage.xml

  caddy-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Caddyfile (production)
        run: |
          docker run --rm -v "${{ github.workspace }}:/etc/caddy" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate Caddyfile.local (dev)
        run: |
          docker run --rm -v "${{ github.workspace }}:/etc/caddy" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile.local --adapter caddyfile

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pycil
          POSTGRES_PASSWORD: pycil
          POSTGRES_DB: pycil
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install core deps + run migrations
        working-directory: apps/pycil-core
        run: |
          uv sync --extra dev
          uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://pycil:pycil@localhost:5432/pycil

      - name: Install psql client
        run: sudo apt-get update -y && sudo apt-get install -y postgresql-client

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests (next dev with API rewrites)
        working-directory: apps/web
        env:
          NODE_ENV: development
          AUTH_JWT_SECRET: e2e-token-long-enough-for-hs256-min-32b
          INTERNAL_API_SECRET: e2e-ci-fake-internal-secret
          AUTH_SECRET: e2e-ci-auth-secret-for-next-auth-test
          SESSION_COOKIE_NAME: pycil-session
          E2E_TEST_USER_ID: 00000000-0000-0000-0000-00000000e2e1
          POSTGRES_USER: pycil
          POSTGRES_PASSWORD: pycil
          POSTGRES_DB: pycil
          PG_HOST: localhost
          PG_PORT: "5432"
          BASE_URL: http://localhost:3000
          CI: "true"
        run: pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
