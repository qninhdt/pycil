name: Tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dir: apps/api
          - name: worker
            dir: apps/worker
          - name: shared
            dir: packages/shared-py
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dev deps for ${{ matrix.name }}
        working-directory: ${{ matrix.dir }}
        run: uv sync --locked --extra dev
      - name: Ruff
        working-directory: ${{ matrix.dir }}
        run: uv run ruff check .

      # Import boundaries. Only api and worker declare contracts; shared-py is a
      # single pure-logic package with no internal boundary to enforce, so it is
      # skipped rather than given an empty config that would always pass.
      #
      # Every contract in those two packages was observed FAILING against a
      # deliberate violation before being committed. That matters here: this repo
      # previously carried two import-linter contracts that had rotted into naming
      # deleted modules while missing every added one, and both still reported
      # KEPT. A contract nobody has watched fail proves nothing.
      - name: Import boundaries
        if: matrix.name != 'shared'
        working-directory: ${{ matrix.dir }}
        run: uv run lint-imports

      # The web client's ERROR_TAXONOMY is `Record<ApiErrorCode, ...>`, keyed off
      # the generated file. So a new API error code does not fail typecheck — the
      # key set simply never grew, and the UI falls through to a generic message
      # for a case someone deliberately named. Nothing regenerated or verified the
      # file before this step; measured at the time it was added, three raised
      # codes were missing from it.
      #
      # Regenerating and failing on a dirty tree makes the omission a red build in
      # the phase that introduced it, rather than a surprise for whoever next
      # touches the frontend.
      # A doc that names a file makes a checkable claim, and this repo had
      # accumulated false ones from three superseded eras. Historical documents
      # are exempt; the rest must cite paths that exist.
      - name: Documentation cites real paths
        if: matrix.name == 'api'
        run: python3 ../../scripts/check-doc-paths.py

      - name: Error codes are regenerated
        if: matrix.name == 'api'
        working-directory: apps/api
        run: |
          uv run python ../../scripts/extract-error-codes.py
          git diff --exit-code ../../apps/web/lib/api/error-codes.generated.ts \
            || { echo "::error::error-codes.generated.ts is stale — run scripts/extract-error-codes.py and commit"; exit 1; }

  test-shared:
    # Pure-logic tests (FSRS math, packages/shared-py/shared/fsrs) — no DB, no I/O.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dev deps
        working-directory: packages/shared-py
        run: uv sync --locked --extra dev
      - name: Assert tests collected (no silent gap)
        working-directory: packages/shared-py
        run: |
          uv run pytest --collect-only -q >/dev/null \
            || { echo "no tests collected (or collection error)"; exit 1; }
      - name: Run tests
        working-directory: packages/shared-py
        # The threshold is passed here rather than in the package's addopts: there
        # it would also judge a single-file run, which fails with every test
        # passing. Matches COV_SHARED in scripts/verify-baseline.sh.
        run: uv run pytest -q --cov-fail-under=78

  test-api:
    # Full suite against a real Postgres + fakeredis (autouse fixture, see
    # apps/api/tests/conftest.py) — LexiClient faked at the port boundary only.
    # No unit/integration marker split: per Phase 12's no-mocked-DB rule nearly
    # every test writes through real Postgres, so there's no meaningful "fast
    # unit" tier to isolate here (that tier is test-shared, above).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pycil
          POSTGRES_PASSWORD: pycil
          POSTGRES_DB: pycil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev deps
        working-directory: apps/api
        run: uv sync --locked --extra dev

      - name: Assert tests collected (no silent gap)
        working-directory: apps/api
        run: |
          uv run pytest --collect-only -q >/dev/null \
            || { echo "no tests collected (or collection error)"; exit 1; }

      # 82, against a measured 83%. A gate below actual lets coverage rot down to
      # the slack silently, so it tracks the measurement and moves up deliberately.
      # Kept in step with COV_API in scripts/verify-baseline.sh, which is the same
      # gate for a local run.
      - name: Run pytest with coverage
        working-directory: apps/api
        env:
          # conftest.py reads TEST_DB_URL directly (not pydantic Settings) —
          # must match the service container above.
          TEST_DB_URL: postgresql+asyncpg://pycil:pycil@localhost:5432/pycil_test
        run: |
          uv run pytest --cov=pycil --cov-fail-under=82 \
            --cov-report=xml -q --maxfail=5

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-api
          path: apps/api/coverage.xml

  test-worker:
    # Execute worker behaviour tests separately; lint alone cannot catch an
    # unregistered job or an API-package import failure in the worker image.
    runs-on: ubuntu-latest
    # Postgres because the reconciler tests need one. Without it they call
    # `pytest.skip`, and the six tests standing between the 24h purge and a
    # learner's answer text — the purge nulls `raw_answer`, and the bug was that
    # it did so under a live grading lease — never ran here at all. A job that
    # skips its most consequential tests reports the same green as one that
    # passes them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pycil
          POSTGRES_PASSWORD: pycil
          POSTGRES_DB: pycil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dev deps
        working-directory: apps/worker
        run: uv sync --locked --extra dev
      - name: Assert tests collected
        working-directory: apps/worker
        run: uv run pytest --collect-only -q >/dev/null
      - name: Run worker tests
        working-directory: apps/worker
        env:
          # The reconciler tests skip themselves without this, silently.
          TEST_DB_URL: postgresql+asyncpg://pycil:pycil@localhost:5432/pycil_test
        # See the shared-py job: the threshold belongs at the whole-suite
        # invocation. Matches COV_WORKER in scripts/verify-baseline.sh.
        #
        # `-rs` prints the skip reasons: this job's whole point is that a skip
        # here is a coverage hole, so it must be visible in the log rather than
        # summarised as a number.
        run: uv run pytest -q -rs --cov-fail-under=81

  migration-head:
    # A metadata create_all test does not prove Alembic's actual upgrade path.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pycil
          POSTGRES_PASSWORD: pycil
          POSTGRES_DB: pycil_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync runtime deps
        working-directory: apps/api
        run: uv sync --locked
      - name: Upgrade a fresh PostgreSQL database to head
        working-directory: apps/api
        env:
          DB_URL: postgresql+asyncpg://pycil:pycil@localhost:5432/pycil_test
          LEXI_DB_URL: postgresql+asyncpg://pycil:pycil@localhost:5432/pycil_test
        run: |
          LEXI_ALEMBIC="$(uv run python -c 'import pathlib, lexi_ai.migrations; print(pathlib.Path(lexi_ai.migrations.__file__).parent / "alembic.ini")')"
          uv run alembic -c "$LEXI_ALEMBIC" upgrade head
          uv run alembic upgrade head
          # Assert a single un-branched head and that the database actually sits on
          # it. The revision id used to be spelled out here, which rotted the moment
          # 0016/0017 landed: this step kept asserting 0015 and the job stayed red
          # for a week while proving nothing.
          heads="$(uv run alembic heads)"
          test "$(printf '%s\n' "$heads" | grep -c .)" -eq 1 \
            || { echo "branched migration history:"; printf '%s\n' "$heads"; exit 1; }
          current="$(uv run alembic current)"
          test "$current" = "$heads" \
            || { echo "database at '$current', expected '$heads'"; exit 1; }

      # The only place a *migrated* schema exists. `tests/conftest.py` builds its
      # schema from the ORM with `create_all`, so a delete rule that differs
      # between a migration and the model is invisible to every test — including
      # the account-deletion test, which reads whatever the ORM declares.
      #
      # `NO ACTION` is the deliberate default here (see the script), so this pins
      # the rules rather than demanding cascades: a migration that quietly turns
      # one into CASCADE removes the loud failure account deletion depends on.
      - name: Assert no foreign-key delete rule changed silently
        working-directory: apps/api
        run: |
          uv run --with 'psycopg[binary]' python ../../scripts/extract-fk-delete-rules.py \
            "postgresql://pycil:pycil@localhost:5432/pycil_test"

  build-images:
    # Ensure both runtime images build from the pinned Lexi VCS dependency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t pycil-api:ci .
      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t pycil-worker:ci .
      - name: Validate Compose interpolation
        env:
          POSTGRES_USER: pycil
          POSTGRES_PASSWORD: pycil
          POSTGRES_DB: pycil
          DATABASE_URL_ASYNC: postgresql+asyncpg://pycil:pycil@postgres:5432/pycil
          REDIS_PASSWORD: redis-ci-password
          REDIS_URL: redis://:redis-ci-password@redis:6379/0
          LEXI_REFERENCE_DATASET_PATH: /tmp/cambridge.db
          LEXI_REFERENCE_DATASET_FINGERPRINT: test-fingerprint
          AUTH_JWT_SECRET: test-jwt-secret
          REFRESH_TOKEN_PEPPER: test-refresh-token-pepper
          INTERNAL_API_SECRET: test-internal-secret
          CENTRIFUGO_API_KEY: test-centrifugo-api-key
          CENTRIFUGO_TOKEN_HMAC_SECRET: test-centrifugo-token-secret
          CENTRIFUGO_PUBLIC_SSE_URL: https://app.example.test/connection/sse
          ALLOWED_ORIGINS: https://app.example.test
        run: docker compose config -q
      - name: Validate TLS/WSS ingress configuration
        run: |
          docker run --rm \
            -e DOMAIN=app.example.test \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  test-web:
    # The web app's stack-independent gate: typecheck, lint, the Vitest unit
    # layer (pure logic — the session reducer, error taxonomy, snapshot
    # reconciliation, mastery mapping, the assistant transport), the mechanical
    # design-system audit, the production build, and the Storybook build.
    #
    # No e2e here. Playwright needs the full `docker compose` stack (API, worker,
    # Postgres, Redis, Centrifugo, Caddy) plus an LLM credential for the
    # generation tier, which is too heavy per push; it belongs on the nightly
    # workflow against a stood-up stack, not this PR gate.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        # Lockfile is authoritative in CI: a drifted manifest fails rather than
        # silently resolving a different tree than a developer ran against.
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Design-system audit
        run: pnpm audit:design

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook
