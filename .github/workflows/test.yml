name: Backend Tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dir: apps/api
          - name: worker
            dir: apps/worker
          - name: shared
            dir: packages/shared-py
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dev deps for ${{ matrix.name }}
        working-directory: ${{ matrix.dir }}
        run: uv sync --extra dev
      - name: Ruff
        working-directory: ${{ matrix.dir }}
        run: uv run ruff check .

  test-shared:
    # Pure-logic tests (FSRS math, packages/shared-py/shared/fsrs) — no DB, no I/O.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dev deps
        working-directory: packages/shared-py
        run: uv sync --extra dev
      - name: Assert tests collected (no silent gap)
        working-directory: packages/shared-py
        run: |
          uv run pytest --collect-only -q >/dev/null \
            || { echo "no tests collected (or collection error)"; exit 1; }
      - name: Run tests
        working-directory: packages/shared-py
        run: uv run pytest -q

  test-api:
    # Full suite against a real Postgres + fakeredis (autouse fixture, see
    # apps/api/tests/conftest.py) — LexiClient faked at the port boundary only.
    # No unit/integration marker split: per Phase 12's no-mocked-DB rule nearly
    # every test writes through real Postgres, so there's no meaningful "fast
    # unit" tier to isolate here (that tier is test-shared, above).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pycil
          POSTGRES_PASSWORD: pycil
          POSTGRES_DB: pycil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev deps
        working-directory: apps/api
        run: uv sync --extra dev

      - name: Assert tests collected (no silent gap)
        working-directory: apps/api
        run: |
          uv run pytest --collect-only -q >/dev/null \
            || { echo "no tests collected (or collection error)"; exit 1; }

      - name: Run pytest with coverage
        working-directory: apps/api
        env:
          # conftest.py reads TEST_DB_URL directly (not pydantic Settings) —
          # must match the service container above.
          TEST_DB_URL: postgresql+asyncpg://pycil:pycil@localhost:5432/pycil_test
        run: |
          uv run pytest --cov=pycil --cov-fail-under=70 \
            --cov-report=xml -q --maxfail=5

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-api
          path: apps/api/coverage.xml

  test-worker:
    # Execute worker behaviour tests separately; lint alone cannot catch an
    # unregistered job or an API-package import failure in the worker image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dev deps
        working-directory: apps/worker
        run: uv sync --extra dev
      - name: Assert tests collected
        working-directory: apps/worker
        run: uv run pytest --collect-only -q >/dev/null
      - name: Run worker tests
        working-directory: apps/worker
        run: uv run pytest -q

  migration-head:
    # A metadata create_all test does not prove Alembic's actual upgrade path.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pycil
          POSTGRES_PASSWORD: pycil
          POSTGRES_DB: pycil_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync runtime deps
        working-directory: apps/api
        run: uv sync
      - name: Upgrade a fresh PostgreSQL database to head
        working-directory: apps/api
        env:
          DB_URL: postgresql+asyncpg://pycil:pycil@localhost:5432/pycil_test
          LEXI_DB_URL: postgresql+asyncpg://pycil:pycil@localhost:5432/pycil_test
        run: |
          LEXI_ALEMBIC="$(uv run python -c 'import pathlib, lexi_ai.migrations; print(pathlib.Path(lexi_ai.migrations.__file__).parent / "alembic.ini")')"
          uv run alembic -c "$LEXI_ALEMBIC" upgrade head
          uv run alembic upgrade head
          # Assert a single un-branched head and that the database actually sits on
          # it. The revision id used to be spelled out here, which rotted the moment
          # 0016/0017 landed: this step kept asserting 0015 and the job stayed red
          # for a week while proving nothing.
          heads="$(uv run alembic heads)"
          test "$(printf '%s\n' "$heads" | grep -c .)" -eq 1 \
            || { echo "branched migration history:"; printf '%s\n' "$heads"; exit 1; }
          current="$(uv run alembic current)"
          test "$current" = "$heads" \
            || { echo "database at '$current', expected '$heads'"; exit 1; }

  build-images:
    # Ensure both runtime images build from the pinned Lexi VCS dependency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t pycil-api:ci .
      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t pycil-worker:ci .
      - name: Validate Compose interpolation
        env:
          POSTGRES_USER: pycil
          POSTGRES_PASSWORD: pycil
          POSTGRES_DB: pycil
          DATABASE_URL_ASYNC: postgresql+asyncpg://pycil:pycil@postgres:5432/pycil
          REDIS_PASSWORD: redis-ci-password
          REDIS_URL: redis://:redis-ci-password@redis:6379/0
          LEXI_REFERENCE_DATASET_PATH: /tmp/cambridge.db
          LEXI_REFERENCE_DATASET_FINGERPRINT: test-fingerprint
          AUTH_JWT_SECRET: test-jwt-secret
          REFRESH_TOKEN_PEPPER: test-refresh-token-pepper
          INTERNAL_API_SECRET: test-internal-secret
          CENTRIFUGO_API_KEY: test-centrifugo-api-key
          CENTRIFUGO_TOKEN_HMAC_SECRET: test-centrifugo-token-secret
          CENTRIFUGO_PUBLIC_SSE_URL: https://app.example.test/connection/sse
          ALLOWED_ORIGINS: https://app.example.test
        run: docker compose config -q
      - name: Validate TLS/WSS ingress configuration
        run: |
          docker run --rm \
            -e DOMAIN=app.example.test \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

# No e2e job: this repo is backend-only (API + worker + shared Python). The
# frontend lives in a separate repository, so browser e2e coverage (if any)
# belongs there, not here.
