name: Backend Tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dir: apps/api
          - name: worker
            dir: apps/worker
          - name: shared
            dir: packages/shared-py
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dev deps for ${{ matrix.name }}
        working-directory: ${{ matrix.dir }}
        run: uv sync --extra dev
      - name: Ruff
        working-directory: ${{ matrix.dir }}
        run: uv run ruff check .

  test-shared:
    # Pure-logic tests (FSRS math, packages/shared-py/shared/fsrs) — no DB, no I/O.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dev deps
        working-directory: packages/shared-py
        run: uv sync --extra dev
      - name: Assert tests collected (no silent gap)
        working-directory: packages/shared-py
        run: |
          uv run pytest --collect-only -q >/dev/null \
            || { echo "no tests collected (or collection error)"; exit 1; }
      - name: Run tests
        working-directory: packages/shared-py
        run: uv run pytest -q

  test-api:
    # Full suite against a real Postgres + fakeredis (autouse fixture, see
    # apps/api/tests/conftest.py) — LexiClient faked at the port boundary only.
    # No unit/integration marker split: per Phase 12's no-mocked-DB rule nearly
    # every test writes through real Postgres, so there's no meaningful "fast
    # unit" tier to isolate here (that tier is test-shared, above).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pycil
          POSTGRES_PASSWORD: pycil
          POSTGRES_DB: pycil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev deps
        working-directory: apps/api
        run: uv sync --extra dev

      - name: Assert tests collected (no silent gap)
        working-directory: apps/api
        run: |
          uv run pytest --collect-only -q >/dev/null \
            || { echo "no tests collected (or collection error)"; exit 1; }

      - name: Run pytest with coverage
        working-directory: apps/api
        env:
          # conftest.py reads TEST_DB_URL directly (not pydantic Settings) —
          # must match the service container above.
          TEST_DB_URL: postgresql+asyncpg://pycil:pycil@localhost:5432/pycil_test
        run: |
          uv run pytest --cov=pycil --cov-fail-under=70 \
            --cov-report=xml -q --maxfail=5

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: apps/api/coverage.xml

# No e2e job: apps/web/e2e/ (Playwright) was removed 2026-07-06 along with
# apps/pycil-core — it drove that app's next-auth/Dex OIDC login and asserted
# ELO fields, neither of which exist in the current stack. The new
# apps/api/pycil/auth/oauth.py hardcodes Google's real endpoints (no local IdP
# swap-in), so rebuilding e2e coverage needs a new auth-testing strategy, not a
# find-and-replace — tracked in docs/project-roadmap.md's operational gaps,
# blocked on Phase 10 (frontend auth/Centrifugo) landing first.
