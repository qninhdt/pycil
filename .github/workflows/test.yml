name: Tests

on:
  workflow_dispatch:
    inputs:
      live_provider:
        description: Also run the fixed paid LLM E2E profile
        type: boolean
        default: false
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_DATA_MODE: mock
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
      - run: npm install --global pnpm@12.9.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm run build

  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
      CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      DECISION_API_KEY: ${{ secrets.DECISION_API_KEY }}
      DECISION_BASE_URL: ${{ secrets.DECISION_BASE_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
      - run: npm install --global pnpm@12.9.1
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir e2e install --frozen-lockfile
      - run: pnpm --dir e2e typecheck
      - run: pnpm --dir e2e test:support
      - run: pnpm --dir e2e exec playwright install --with-deps chromium
      - run: pnpm --dir e2e test
      - run: pnpm --dir e2e test:live
        if: ${{ inputs.live_provider }}
      # Reports contain authentication data. No public artifact upload is configured.

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
      - run: uv python install 3.14.8
      - run: uv sync --locked
        working-directory: apps/api
      - run: uv run --locked ruff check pycil tests migrations ../../scripts/export_openapi.py
        working-directory: apps/api
      - run: uv run --locked ruff format --check pycil tests migrations ../../scripts/export_openapi.py
        working-directory: apps/api
      # Each test creates/drops only its own database; providers are deterministic.
      # Testcontainers owns the real PostgreSQL/Redis services.
      - run: uv run --locked pytest tests -q --tb=short
        working-directory: apps/api

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -f apps/api/Dockerfile -t pycil-api:ci .
      - name: Validate Compose without local secrets
        env:
          DB_URL: postgresql+asyncpg://test:test-only@127.0.0.1:5432/rewrite_test
          REDIS_URL: redis://:test-only@127.0.0.1:6379/15
          CLERK_JWKS_URL: https://identity.invalid/jwks
          CLERK_ISSUER: https://identity.invalid
          CLERK_SECRET_KEY: test-only
          LLM_API_KEY: test-only
          LLM_BASE_URL: https://inference.invalid/v1
          DECISION_API_KEY: test-only
          DECISION_BASE_URL: https://decision.invalid
        run: python scripts/compose.py --env-file /dev/null config -q
      - name: Validate Caddy routes
        run: >-
          docker run --rm -e DOMAIN=app.example.test
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.6-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
