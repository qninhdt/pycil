name: Backend Tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [pycil-core, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dev deps for ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: uv sync --extra dev
      - name: Ruff
        working-directory: apps/${{ matrix.app }}
        run: uv run ruff check .

  unit:
    # Fast, no Postgres — fails before integration spins a DB container.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [pycil-core, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dev deps for ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: uv sync --extra dev
      - name: Assert unit tests collected (no silent gap)
        working-directory: apps/${{ matrix.app }}
        run: |
          n=$(uv run pytest --collect-only -m unit -q 2>/dev/null | tail -1)
          echo "collected: $n"
          uv run pytest --collect-only -m unit -q >/dev/null 2>&1 \
            || { echo "no unit tests collected"; exit 1; }
      - name: Run unit tests
        working-directory: apps/${{ matrix.app }}
        env:
          AUTH_JWT_SECRET: ci-fake-secret
          INTERNAL_API_SECRET: ci-fake-internal
          OPENROUTER_API_KEY: ci-fake
          ALLOWED_ORIGINS: http://localhost:3000
        run: uv run pytest -m unit -q

  integration:
    # Full suite (minus opt-in llm_live) against a real Postgres service +
    # fakeredis. Carries the coverage gate. PYTEST_PG_* MUST match the service
    # container: the conftest reads those vars (defaults 55432/test/test) for
    # the pytest-postgresql noproc connection — DATABASE_URL alone is not enough.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [pycil-core, worker]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pycil
          POSTGRES_PASSWORD: pycil
          POSTGRES_DB: pycil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev deps for ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: uv sync --extra dev

      - name: Assert integration tests collected (no silent gap)
        working-directory: apps/${{ matrix.app }}
        run: |
          uv run pytest --collect-only -m "not unit and not llm_live" -q >/dev/null 2>&1 \
            || { echo "no integration tests collected"; exit 1; }

      - name: Run pytest with coverage
        working-directory: apps/${{ matrix.app }}
        env:
          # Match the service container so the conftest noproc connection lands.
          PYTEST_PG_HOST: localhost
          PYTEST_PG_PORT: "5432"
          PYTEST_PG_USER: pycil
          PYTEST_PG_PASSWORD: pycil
          DATABASE_URL: postgresql+asyncpg://pycil:pycil@localhost:5432/pycil_test
          REDIS_URL: redis://localhost:6379/0
          AUTH_JWT_SECRET: ci-fake-secret
          INTERNAL_API_SECRET: ci-fake-internal
          OPENROUTER_API_KEY: ci-fake
          ALLOWED_ORIGINS: http://localhost:3000
        run: |
          if [ "${{ matrix.app }}" = "pycil-core" ]; then
            uv run pytest -m "not unit and not llm_live" --cov=pycil_core \
              --cov-fail-under=70 --cov-report=xml -q --maxfail=5
          else
            uv run pytest -m "not unit and not llm_live" --cov=worker \
              --cov-fail-under=70 --cov-report=xml -q --maxfail=5
          fi

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: apps/${{ matrix.app }}/coverage.xml


  caddy-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Caddyfile (production)
        run: |
          docker run --rm -e DOMAIN=example.com -e CADDY_ACME_EMAIL=admin@example.com \
            -v "${{ github.workspace }}:/etc/caddy" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate Caddyfile.local (dev)
        run: |
          docker run --rm -v "${{ github.workspace }}:/etc/caddy" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile.local --adapter caddyfile

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pycil
          POSTGRES_PASSWORD: pycil
          POSTGRES_DB: pycil
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Start Dex OIDC
        run: |
          docker run -d --name pycil-dex \
            -p 127.0.0.1:5556:5556 \
            -v "${{ github.workspace }}/infra/dex/config.yaml:/etc/dex/config.yaml:ro" \
            ghcr.io/dexidp/dex:v2.41.1 \
            dex serve /etc/dex/config.yaml
          for i in {1..30}; do
            if curl -fsS http://localhost:5556/dex/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs pycil-dex
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install core deps + run migrations
        working-directory: apps/pycil-core
        run: |
          uv sync --extra dev
          uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://pycil:pycil@localhost:5432/pycil

      - name: Start pycil-core
        working-directory: apps/pycil-core
        env:
          DATABASE_URL: postgresql+asyncpg://pycil:pycil@localhost:5432/pycil
          REDIS_URL: redis://localhost:6379/0
          ALLOWED_ORIGINS: http://localhost:3000
          SESSION_COOKIE_NAME: __Secure-pycil-session
          AUTH_JWT_SECRET: e2e-token-long-enough-for-hs256-min-32b
          INTERNAL_API_SECRET: e2e-ci-fake-internal-secret
          OPENROUTER_API_KEY: ci-fake
          OPENROUTER_MODEL: openai/gpt-4o-mini
          OPENROUTER_BUDGET_DAILY_USD: "20"
          LLM_STUB_MODE: "true"
        run: |
          nohup uv run uvicorn pycil_core.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/pycil-core.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pycil-core.pid"
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/pycil-core.log"
          exit 1

      - name: Install psql client
        run: sudo apt-get update -y && sudo apt-get install -y postgresql-client

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests (next dev with API rewrites)
        working-directory: apps/web
        env:
          AUTH_JWT_SECRET: e2e-token-long-enough-for-hs256-min-32b
          INTERNAL_API_SECRET: e2e-ci-fake-internal-secret
          AUTH_SECRET: e2e-ci-auth-secret-for-next-auth-test
          SESSION_COOKIE_NAME: __Secure-pycil-session
          POSTGRES_USER: pycil
          POSTGRES_PASSWORD: pycil
          POSTGRES_DB: pycil
          PG_HOST: localhost
          PG_PORT: "5432"
          BASE_URL: http://localhost:3000
          AUTH_URL: http://localhost:3000
          E2E_PROXY: "true"
          PYCIL_CORE_INTERNAL_URL: http://localhost:8000
          NEXT_DEV_PROXY_TARGET: http://localhost:8000
          OIDC_ISSUER_URL: http://localhost:5556/dex
          OIDC_CLIENT_ID: pycil-web
          OIDC_CLIENT_SECRET: pycil-dex-secret-local-only
          OIDC_PROVIDER_ID: oidc
          OIDC_PROVIDER_NAME: Dex
          E2E_WORKER_SPECS: "false"
          WORKER_LLM_STUB: "true"
          LLM_STUB_MODE: "true"
          CI: "true"
        run: pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
