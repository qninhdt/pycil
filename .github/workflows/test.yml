name: Tests

on:
  workflow_dispatch:
    inputs:
      live_provider:
        description: Also run the fixed paid LLM E2E profile
        type: boolean
        default: false
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_DATA_MODE: mock
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
      PLAYWRIGHT_USE_PROD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - run: npm install --global pnpm@12.9.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - name: Performance workload contract
        run: node --test tests/performance/tests/*.test.js
        working-directory: .
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-frontend-${{ hashFiles('apps/web/pnpm-lock.yaml', 'apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-frontend-
      - run: pnpm run build:mock
      - run: pnpm test:vitest
      - run: pnpm test:browser

  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
      CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      DECISION_API_KEY: ${{ secrets.DECISION_API_KEY }}
      DECISION_BASE_URL: ${{ secrets.DECISION_BASE_URL }}
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - run: npm install --global pnpm@12.9.1
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir tests/e2e install --frozen-lockfile
      - run: pnpm --dir tests/e2e typecheck
      - run: pnpm --dir tests/e2e test:support
      - run: pnpm --dir tests/e2e exec playwright install --with-deps chromium
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.e2e/build-cache
            apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('apps/web/pnpm-lock.yaml', 'apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-
      - run: pnpm --dir tests/e2e test
        env:
          E2E_CACHE_BUILD: "1"
      - run: pnpm --dir tests/e2e test:live
        if: ${{ inputs.live_provider }}
      # Reports contain authentication data. No public artifact upload is configured.

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
      - run: uv python install 3.14.8
      - run: uv sync --locked
        working-directory: apps/api
      - run: uv run --locked ruff check pycil tests migrations ../../scripts/export_openapi.py ../../scripts/run-k6.py ../../tests/performance/tests
        working-directory: apps/api
      - run: uv run --locked ruff format --check pycil tests migrations ../../scripts/export_openapi.py ../../scripts/run-k6.py ../../tests/performance/tests
        working-directory: apps/api
      - name: Performance runner safety checks
        run: uv run --locked python -m unittest discover -s ../../tests/performance/tests -p 'test_*.py' -v
        working-directory: apps/api
      # Each test creates/drops only its own database; providers are deterministic.
      # Testcontainers owns the real PostgreSQL/Redis services.
      - run: uv run --locked coverage run --parallel-mode -m pytest tests -n 2 -q --tb=short
        working-directory: apps/api
      - run: uv run --locked coverage combine
        working-directory: apps/api

      - run: uv run --locked coverage xml -o coverage.xml
        working-directory: apps/api

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configuration and secret gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scanners: misconfig,secret
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/source-security.json
          cache: 'false'

  image:
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the only release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: pycil-api:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Export the built image
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          docker save pycil-api:ci -o "$RUNNER_TEMP/release/api.tar"
      - name: Image vulnerability and secret gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: 'true'
        with:
          version: v0.75.0
          input: ${{ runner.temp }}/release/api.tar
          trivyignores: .trivyignore.yaml
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/image-security.json
          cache: 'false'
      - name: SBOM for the scanned artifact
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          input: ${{ runner.temp }}/release/api.tar
          format: cyclonedx
          output: ${{ runner.temp }}/release/sbom.cdx.json
          cache: 'false'
      - name: Record artifact checksum and scan time
        run: |
          cp .trivyignore.yaml "$RUNNER_TEMP/release/trivy-exceptions.yaml"
          cd "$RUNNER_TEMP/release"
          sha256sum api.tar sbom.cdx.json trivy-exceptions.yaml > SHA256SUMS
          jq -n --arg sha "$GITHUB_SHA" --arg scanned_at "$(date -u +%FT%TZ)" \
            '{source_sha:$sha, platform:"linux/amd64", trivy_version:"0.75.0", scanned_at:$scanned_at,
              exception_policy:"trivy-exceptions.yaml"}' > scan.json
      - name: Validate Compose without local secrets
        env:
          DB_URL: postgresql+asyncpg://test:test-only@127.0.0.1:5432/rewrite_test
          REDIS_URL: redis://:test-only@127.0.0.1:6379/15
          CLERK_JWKS_URL: https://identity.invalid/jwks
          CLERK_ISSUER: https://identity.invalid
          CLERK_SECRET_KEY: test-only
          POSTGRES_ADMIN_PASSWORD: test-admin-only
          ALLOWED_ORIGINS: https://app.example.test
          RELEASE_IMAGE: pycil-api:ci
          BLUE_API_IMAGE: pycil-api:ci
          GREEN_API_IMAGE: pycil-api:ci
          POSTGRES_WALG_IMAGE: pycil-postgres:ci
          WALG_S3_PREFIX: s3://configuration-check/vps/1/pg18
          BACKUP_KEY_FINGERPRINT: configuration-check
          GRAFANA_ENV_FILE: /dev/null
          ALLOY_ENV_FILE: /dev/null
          LLM_API_KEY: test-only
          LLM_BASE_URL: https://inference.invalid/v1
          DECISION_API_KEY: test-only
          DECISION_BASE_URL: https://decision.invalid
        run: |
          python scripts/compose.py --env-file /dev/null config -q
          python scripts/compose.py --env-file /dev/null --file infra/vps/compose.yaml config -q
          python -m unittest discover -s infra/vps/tests -v
          bash -n infra/vps/deploy.sh infra/vps/cd.sh infra/vps/init-application-role.sh
      - name: Validate Caddy routes
        run: |
          docker run --rm -e DOMAIN=app.example.test \
            -v "$PWD/infra/local/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.6-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          tls_dir=$(mktemp -d)
          trap 'rm -rf -- "$tls_dir"' EXIT
          openssl req -x509 -newkey ed25519 -noenc -days 1 -subj /CN=api.pycil.qninhdt.com \
            -keyout "$tls_dir/origin.key" -out "$tls_dir/origin.crt"
          docker run --rm \
            -v "$PWD/infra/vps/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/infra/vps:/etc/caddy/routing:ro" \
            -v "$tls_dir:/run/secrets/tls:ro" \
            caddy:2.11.6-alpine@sha256:c776e0c6413b544d0459665e54ec7b8b2a15000c0cbee8b254da0067b1d184ff \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Transfer the scanned image to trusted publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-${{ github.sha }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
