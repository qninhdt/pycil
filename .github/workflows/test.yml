name: Tests

on:
  workflow_dispatch:
    inputs:
      live_provider:
        description: Run the selected paid LLM E2E checks
        type: boolean
        default: false
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_DATA_MODE: mock
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
      - run: npm install --global pnpm@12.9.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm run build

  frontend-e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
      CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
      INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
      INFERENCE_BASE_URL: ${{ secrets.INFERENCE_BASE_URL }}
      LEXI_DECISION_API_KEY: ${{ secrets.LEXI_DECISION_API_KEY }}
      LEXI_DECISION_BASE_URL: ${{ secrets.LEXI_DECISION_BASE_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"
      - run: uv python install 3.14.8
      - run: npm install --global pnpm@12.9.1
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: pnpm test:e2e
        if: ${{ !inputs.live_provider }}
      - run: pnpm test:e2e:live
        if: ${{ inputs.live_provider }}

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rewrite_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d rewrite_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10.2-alpine3.23
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DB_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/rewrite_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
      - run: uv python install 3.14.8
      - name: Verify packaged Lexi bytes
        run: sha256sum --check SHA256SUMS
        working-directory: vendor/lexi-ai
      - run: uv sync --locked
        working-directory: apps/api
      - run: uv run --locked ruff check pycil tests migrations ../../scripts/test_api.py ../../scripts/export_openapi.py
        working-directory: apps/api
      - run: uv run --locked ruff format --check pycil tests migrations ../../scripts/test_api.py ../../scripts/export_openapi.py
        working-directory: apps/api
      # Each test creates/drops only its own database; providers are deterministic.
      # Reference fixtures are newly written native SQLite records, not evidence.
      - run: uv run --locked pytest tests -q --tb=short
        working-directory: apps/api

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -f apps/api/Dockerfile -t pycil-api:ci .
      - name: Validate Compose without local secrets
        env:
          DB_URL: postgresql+asyncpg://test:test-only@127.0.0.1:5432/rewrite_test
          REDIS_URL: redis://:test-only@127.0.0.1:6379/15
          CLERK_JWKS_URL: https://identity.invalid/jwks
          CLERK_ISSUER: https://identity.invalid
          CLERK_SECRET_KEY: test-only
          INFERENCE_API_KEY: test-only
          INFERENCE_BASE_URL: https://inference.invalid/v1
          LEXI_DECISION_API_KEY: test-only
          LEXI_DECISION_BASE_URL: https://decision.invalid
        run: python scripts/compose.py --env-file /dev/null config -q
      - name: Validate Caddy routes
        run: >-
          docker run --rm -e DOMAIN=app.example.test
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.6-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
