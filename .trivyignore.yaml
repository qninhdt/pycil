misconfigurations:
  - id: AVD-DS-0002
    paths:
      - "infra/vps/backup/Dockerfile"
    statement: >-
      The official PostgreSQL entrypoint initializes volume ownership as root,
      then execs PostgreSQL as postgres. The backup utility runs as UID 999 in Compose.
