# Independent, disposable stores. No runtime .env, application services, or shared volumes.
services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: rewrite_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test", "-d", "rewrite_test"]
      interval: 1s
      timeout: 3s
      retries: 60

  redis:
    image: redis:8.10.2-alpine3.23
    ports:
      - "127.0.0.1::6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 60
