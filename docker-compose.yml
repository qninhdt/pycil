name: pycil

# Shared fragments (merged with `<<:` below). DRYs the env + dependency blocks
# duplicated across pycil-core and worker so a new shared knob is added once.
x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL_ASYNC}
  REDIS_URL: ${REDIS_URL}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL}
  OPENROUTER_BUDGET_DAILY_USD: ${OPENROUTER_BUDGET_DAILY_USD}

x-depends-stores: &depends-stores
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pycil-core:
    image: ${CORE_IMAGE:-pycil-core:latest}
    build:
      context: .
      dockerfile: apps/pycil-core/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_SECRET_PREVIOUS: ${AUTH_JWT_SECRET_PREVIOUS:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      JWT_MAX_AGE_SECONDS: ${JWT_MAX_AGE_SECONDS:-604800}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-}
    depends_on: *depends-stores
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    image: ${WORKER_IMAGE:-pycil-worker:latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      OPENROUTER_MODEL_FALLBACKS: ${OPENROUTER_MODEL_FALLBACKS:-}
    depends_on: *depends-stores
    healthcheck:
      # python:3.12-slim has no redis-cli, so probe via the in-image redis
      # client. Lives in base so the prod worker is health-gated too (staging
      # previously added this only locally).
      test: ["CMD", "python", "-c", "import arq, redis, os; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 10s
      timeout: 5s
      retries: 6

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL}
    volumes:
      # Caddyfile selected by env, NOT a destructive `cp`. Defaults to the
      # tracked prod Caddyfile, so prod (base-only, no overlay) is always
      # correct and the prod file is never overwritten on disk. Local dev sets
      # CADDYFILE=./Caddyfile.local (see docker-compose.staging.yml / README).
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - pycil-core

  backup:
    image: pycil-backup:latest
    build:
      context: ./infra/backup
    profiles: ["backup"]
    environment:
      DATABASE_URL: ${DATABASE_URL_SYNC:-${DATABASE_URL}}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
    secrets:
      - restic_password
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  restic_password:
    file: ./infra/backup/restic.password

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
