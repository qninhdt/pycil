name: pycil

# Shared fragments (merged with `<<:` below). DRYs the env + dependency blocks
# duplicated across api and worker so a new shared knob is added once.
x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DOMAIN: ${DOMAIN}
  # Host tools use loopback ports; containers must use Docker DNS instead.
  # Dedicated overrides keep external database/Redis deployments supported.
  DB_URL: ${PYCIL_DOCKER_DB_URL:-postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
  REDIS_URL: ${PYCIL_DOCKER_REDIS_URL:-redis://:${REDIS_PASSWORD:-redis-dev-only}@redis:6379/0}

x-lexi-env: &lexi-env
  # Lexi is a library with its own schema in this PostgreSQL database. Runtime
  # processes never create or migrate these tables.
  LEXI_DB_URL: ${PYCIL_DOCKER_LEXI_DB_URL:-postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
  LEXI_DB_SCHEMA: ${LEXI_DB_SCHEMA:-lexi}
  LEXI_CAMBRIDGE_DB_PATH: /reference/cambridge.db
  LEXI_DOMAIN_MIGRATION_HEAD: ${LEXI_DOMAIN_MIGRATION_HEAD:-20260722_01}

x-lexi-provider-env: &lexi-provider-env
  # Providers are a worker-only capability. The API gets only the reader facade.
  LEXI_LLM_BASE_URL: ${LEXI_LLM_BASE_URL:-https://api.openai.com/v1}
  LEXI_LLM_API_KEY: ${LEXI_LLM_API_KEY:-}
  LEXI_LLM_MODEL: ${LEXI_LLM_MODEL:-gpt-4o-mini}
  LEXI_LLM_TEMPERATURE: ${LEXI_LLM_TEMPERATURE:-0.1}
  LEXI_LLM_STRUCTURED_METHOD: ${LEXI_LLM_STRUCTURED_METHOD:-}
  LEXI_LLM_REASONING_EFFORT: ${LEXI_LLM_REASONING_EFFORT:-}

x-assistant-env: &assistant-env
  ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
  ASSISTANT_MODEL: ${ASSISTANT_MODEL:-gpt-4o-mini}
  ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-}
  ASSISTANT_REASONING_EFFORT: ${ASSISTANT_REASONING_EFFORT:-}
  ASSISTANT_CHECKPOINT_DB_URL: ${ASSISTANT_CHECKPOINT_DB_URL:-}
  ASSISTANT_TIMEOUT_SECONDS: ${ASSISTANT_TIMEOUT_SECONDS:-45}
  ASSISTANT_RUN_DEADLINE_SECONDS: ${ASSISTANT_RUN_DEADLINE_SECONDS:-120}
  ASSISTANT_MAX_OUTPUT_TOKENS: ${ASSISTANT_MAX_OUTPUT_TOKENS:-800}
  ASSISTANT_MAX_TOOL_CALLS: ${ASSISTANT_MAX_TOOL_CALLS:-12}
  ASSISTANT_MAX_MESSAGE_CHARS: ${ASSISTANT_MAX_MESSAGE_CHARS:-8000}
  ASSISTANT_PER_USER_CONCURRENCY: ${ASSISTANT_PER_USER_CONCURRENCY:-2}
  ASSISTANT_GLOBAL_CONCURRENCY: ${ASSISTANT_GLOBAL_CONCURRENCY:-50}
  ASSISTANT_ACTION_TTL_SECONDS: ${ASSISTANT_ACTION_TTL_SECONDS:-900}
  ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-30}
  ASSISTANT_AUDIT_RETENTION_DAYS: ${ASSISTANT_AUDIT_RETENTION_DAYS:-90}
  ASSISTANT_MONTHLY_BUDGET_USD: ${ASSISTANT_MONTHLY_BUDGET_USD:-0}
  ASSISTANT_ESTIMATED_COST_PER_1K_TOKENS_USD: ${ASSISTANT_ESTIMATED_COST_PER_1K_TOKENS_USD:-0.01}
  ASSISTANT_REQUESTS_PER_MINUTE: ${ASSISTANT_REQUESTS_PER_MINUTE:-30}

x-depends-stores: &depends-stores
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD:-redis-dev-only}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-only}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-redis-dev-only}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  centrifugo:
    image: centrifugo/centrifugo:v6.8.3
    restart: unless-stopped
    # The mounted config is mandatory: it enables SSE, Redis recovery, and the
    # application-owned subscribe proxy for opaque async resources.
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    environment:
      CENTRIFUGO_ADMIN: "false"
      # Keep local defaults in lockstep with the API settings. Production is
      # still rejected unless these placeholders are replaced.
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET:-changeme-centrifugo-token-secret}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-changeme-centrifugo-api-key}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost https://localhost http://localhost:3000}
      CENTRIFUGO_ENGINE_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-only}
      CENTRIFUGO_PROXY_STATIC_HTTP_HEADERS: '{"X-Centrifugo-Subscribe-Proxy-Secret":"${CENTRIFUGO_SUBSCRIBE_PROXY_SECRET:-changeme-centrifugo-subscribe-proxy-secret}"}'
      CENTRIFUGO_HEALTH: "true"
    volumes:
      - ./centrifugo-config.json:/centrifugo/config.json:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      # HTTP only redirects to HTTPS. Let local stacks avoid a host-port clash
      # without changing the public TLS/SSE endpoint on 443.
      - "${CADDY_HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      centrifugo:
        condition: service_healthy

  # One-shot migration gate: a healthy Postgres is NOT a migrated Postgres.
  # api + worker depend_on this completing successfully before they start.
  migrate:
    image: ${API_IMAGE:-pycil-api:latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: [*backend-env, *lexi-env]
    depends_on:
      postgres:
        condition: service_healthy
    # The domain schema must exist before Pycil tables and embedded workloads.
    # Both commands are idempotent for the pre-release fresh-schema deployment.
    command: ["sh", "-c", "LEXI_ALEMBIC=$$(python -c 'import lexi_ai.migrations, pathlib; print(pathlib.Path(lexi_ai.migrations.__file__).parent / \"alembic.ini\")') && alembic -c \"$$LEXI_ALEMBIC\" upgrade head && test \"$$(alembic -c \"$$LEXI_ALEMBIC\" current | awk 'NR == 1 {print $$1}')\" = \"$$LEXI_DOMAIN_MIGRATION_HEAD\" && alembic upgrade head"]
    restart: "no"

  api:
    image: ${API_IMAGE:-pycil-api:latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*backend-env, *lexi-env, *assistant-env]
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${AUTH_JWT_SECRET}
      JWT_SECRET_PREVIOUS: ${AUTH_JWT_SECRET_PREVIOUS:-}
      JWT_MAX_AGE_SECONDS: ${JWT_MAX_AGE_SECONDS:-604800}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-changeme-refresh-token-pepper}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URIS: ${OAUTH_REDIRECT_URIS:-}
      DEV_IDENTITY_ENABLED: ${DEV_IDENTITY_ENABLED:-false}
      DEV_IDENTITY_EMAIL: ${DEV_IDENTITY_EMAIL:-dev@pycil.local}
      INTERNAL_SECRET: ${INTERNAL_API_SECRET}
      CENTRIFUGO_URL: ${CENTRIFUGO_URL:-http://centrifugo:8000}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-changeme-centrifugo-api-key}
      CENTRIFUGO_TOKEN_HMAC_SECRET: ${CENTRIFUGO_TOKEN_HMAC_SECRET:-changeme-centrifugo-token-secret}
      CENTRIFUGO_PUBLIC_SSE_URL: ${CENTRIFUGO_PUBLIC_SSE_URL:-https://localhost/connection/sse}
      CENTRIFUGO_SUBSCRIBE_PROXY_SECRET: ${CENTRIFUGO_SUBSCRIBE_PROXY_SECRET:-changeme-centrifugo-subscribe-proxy-secret}
      WORD_GENERATION_REQUESTS_PER_HOUR: ${WORD_GENERATION_REQUESTS_PER_HOUR:-5}
      WORD_GENERATION_MAX_INFLIGHT_PER_USER: ${WORD_GENERATION_MAX_INFLIGHT_PER_USER:-10}
      WORD_GENERATION_MAX_INFLIGHT_GLOBAL: ${WORD_GENERATION_MAX_INFLIGHT_GLOBAL:-500}
      WORD_GENERATION_DAILY_LIMIT: ${WORD_GENERATION_DAILY_LIMIT:-1000}
    # Debug-only direct access is loopback-bound. Public API/SSE traffic goes
    # through Caddy on 80/443; production never exposes the application port.
    ports:
      - "${API_HOST_PORT:-127.0.0.1:8000}:8000"
    depends_on: *depends-stores
    volumes:
      - ${LEXI_REFERENCE_DATASET_PATH:?LEXI_REFERENCE_DATASET_PATH is required}:/reference/cambridge.db:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    image: ${WORKER_IMAGE:-pycil-worker:latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*backend-env, *lexi-env, *lexi-provider-env]
      INTERNAL_SECRET: ${INTERNAL_API_SECRET}
      PYCIL_API_INTERNAL_URL: ${PYCIL_API_INTERNAL_URL:-http://api:8000}
    depends_on: *depends-stores
    volumes:
      - ${LEXI_REFERENCE_DATASET_PATH:?LEXI_REFERENCE_DATASET_PATH is required}:/reference/cambridge.db:ro
    healthcheck:
      # python:3.12-slim has no redis-cli, so probe via the in-image redis
      # client. Lives in base so the prod worker is health-gated too.
      test: ["CMD", "python", "-c", "import arq, redis, os; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 10s
      timeout: 5s
      retries: 6

  backup:
    image: pycil-backup:latest
    build:
      context: ./infra/backup
    profiles: ["backup"]
    environment:
      DATABASE_URL: ${DATABASE_URL_SYNC:-${DATABASE_URL}}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
    secrets:
      - restic_password
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  restic_password:
    file: ./infra/backup/restic.password

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
