name: pycil

# Shared fragments (merged with `<<:` below). DRYs the env + dependency blocks
# duplicated across api and worker so a new shared knob is added once.
x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DOMAIN: ${DOMAIN}
  # Host tools use loopback ports; containers must use Docker DNS instead.
  # Dedicated overrides keep external database/Redis deployments supported.
  DB_URL: ${PYCIL_DOCKER_DB_URL:-postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
  REDIS_URL: ${PYCIL_DOCKER_REDIS_URL:-redis://:${REDIS_PASSWORD:-redis-dev-only}@redis:6379/0}

x-lexi-env: &lexi-env
  # Lexi is a library with its own schema in this PostgreSQL database. Runtime
  # processes never create or migrate these tables.
  LEXI_DB_URL: ${PYCIL_DOCKER_LEXI_DB_URL:-postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
  LEXI_DB_SCHEMA: ${LEXI_DB_SCHEMA:-lexi}
  LEXI_CAMBRIDGE_DB_PATH: /reference/cambridge.db
  LEXI_DOMAIN_MIGRATION_HEAD: ${LEXI_DOMAIN_MIGRATION_HEAD:-20260806_01}
  LEXI_REFERENCE_DATASET_FINGERPRINT: ${LEXI_REFERENCE_DATASET_FINGERPRINT:-}
  # Lexi keeps sense vectors outside its relational schema, behind an opt-in
  # feature switch. Pycil installs neither optional extra and calls no semantic
  # search, so the feature stays off: nothing is embedded, no volume is written,
  # and an accidental call fails loudly instead of silently returning no matches.
  # Enabling it means adding Lexi's [embeddings] AND [lancedb] extras, a persistent
  # mount for LEXI_VECTOR_PATH, and setting this to lancedb — never `memory`, which
  # loses every vector on restart.
  LEXI_VECTOR_BACKEND: ${LEXI_VECTOR_BACKEND:-none}

x-lexi-provider-env: &lexi-provider-env
  # Providers are a worker-only capability. The API gets only the reader facade.
  LEXI_LLM_BASE_URL: ${LEXI_LLM_BASE_URL:-https://api.vilao.ai/v1}
  LEXI_LLM_API_KEY: ${LEXI_LLM_API_KEY:-}
  LEXI_LLM_MODEL: ${LEXI_LLM_MODEL:-gemini-3.8-flash}
  LEXI_LLM_TEMPERATURE: ${LEXI_LLM_TEMPERATURE:-0.1}
  # Falls back to the path that strips nullable unions, not the one that does not:
  # an unset variable must not silently select the schema shape a proxy answers
  # with an empty object.
  LEXI_LLM_STRUCTURED_METHOD: ${LEXI_LLM_STRUCTURED_METHOD:-function_calling}
  LEXI_LLM_REASONING_EFFORT: ${LEXI_LLM_REASONING_EFFORT:-}

x-assistant-env: &assistant-env
  # Connection and credential only. The model, its reasoning effort and the turn
  # budget are product policy in config/config.yaml, so changing one is a config
  # edit rather than an environment change across every replica.
  ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
  ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-https://api.vilao.ai/v1}
  ASSISTANT_CHECKPOINT_DB_URL: ${ASSISTANT_CHECKPOINT_DB_URL:-}
  ASSISTANT_RUN_DEADLINE_SECONDS: ${ASSISTANT_RUN_DEADLINE_SECONDS:-120}
  ASSISTANT_MAX_MESSAGE_CHARS: ${ASSISTANT_MAX_MESSAGE_CHARS:-8000}
  ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-30}

x-depends-stores: &depends-stores
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Loopback-bound debugging access only; containers reach Postgres over Docker
    # DNS. Parameterised because 5433 is a common second-Postgres port and a
    # clash with an unrelated local stack must not block this one.
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD:-redis-dev-only}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-only}
    ports:
      # Parameterised and loopback-bound, matching POSTGRES_HOST_PORT /
      # API_HOST_PORT / WEB_HOST_PORT. It was "6379:6379", which bound every
      # interface and made scripts/rehearse-fresh-schema.sh unable to run beside
      # the live stack — the rehearsal is a second compose project on one host,
      # so a hardcoded host port made the two mutually exclusive.
      - "${REDIS_HOST_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-redis-dev-only}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      # HTTP only redirects to HTTPS. Let local stacks avoid a host-port clash
      # without changing the public TLS/SSE endpoint on 443.
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  # One-shot migration gate: a healthy Postgres is NOT a migrated Postgres.
  # api + worker depend_on this completing successfully before they start.
  migrate:
    image: ${API_IMAGE:-pycil-api:latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: [*backend-env, *lexi-env]
    depends_on:
      postgres:
        condition: service_healthy
    # The domain schema must exist before Pycil tables and embedded workloads.
    # Both commands are idempotent for the pre-release fresh-schema deployment.
    command: ["sh", "-c", "LEXI_ALEMBIC=$$(python -c 'import lexi_ai.migrations, pathlib; print(pathlib.Path(lexi_ai.migrations.__file__).parent / \"alembic.ini\")') && alembic -c \"$$LEXI_ALEMBIC\" upgrade head && test \"$$(alembic -c \"$$LEXI_ALEMBIC\" current | awk 'NR == 1 {print $$1}')\" = \"$$LEXI_DOMAIN_MIGRATION_HEAD\" && alembic upgrade head"]
    restart: "no"

  api:
    image: ${API_IMAGE:-pycil-api:latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*backend-env, *lexi-env, *lexi-provider-env, *assistant-env]
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      # Clerk owns sessions; the API only verifies against the JWKS and maps the
      # subject to an internal UUID.
      CLERK_JWKS_URL: ${CLERK_JWKS_URL}
      CLERK_ISSUER: ${CLERK_ISSUER}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      INTERNAL_SECRET: ${INTERNAL_API_SECRET}
    # Debug-only direct access is loopback-bound. Public API/SSE traffic goes
    # through Caddy on 80/443; production never exposes the application port.
    ports:
      - "${API_HOST_PORT:-127.0.0.1:8000}:8000"
    depends_on: *depends-stores
    volumes:
      - ${LEXI_REFERENCE_DATASET_PATH:?LEXI_REFERENCE_DATASET_PATH is required}:/reference/cambridge.db:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
