name: pycil

# All policy is baked from config/config.yaml; only addresses/credentials go here.
x-runtime-env: &runtime-env
  # _DB_* / _REDIS_* are derived by scripts/compose.py, never user configuration.
  DB_URL: ${_DB_URL:?run scripts/compose.py instead of raw docker compose}
  REDIS_URL: ${_REDIS_URL:?run scripts/compose.py instead of raw docker compose}
  CLERK_JWKS_URL: ${CLERK_JWKS_URL}
  CLERK_ISSUER: ${CLERK_ISSUER}
  CLERK_AUDIENCE: ${CLERK_AUDIENCE:-}
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
  LLM_API_KEY: ${LLM_API_KEY}
  LLM_BASE_URL: ${LLM_BASE_URL}
  DECISION_API_KEY: ${DECISION_API_KEY}
  DECISION_BASE_URL: ${DECISION_BASE_URL}
  SEARCH_INDEX_PATH: /var/lib/pycil/search

x-stores-ready: &stores-ready
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

x-backend: &backend
  image: ${API_IMAGE:-pycil-api:local}
  build:
    context: .
    dockerfile: apps/api/Dockerfile

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${_DB_USER}
      POSTGRES_PASSWORD: ${_DB_PASSWORD}
      POSTGRES_DB: ${_DB_NAME}
    ports:
      - "${_DB_BIND}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.2-alpine3.23
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --user \"$$REDIS_USER\" on \">$$REDIS_PASSWORD\" '~*' '&*' +@all"]
    environment:
      REDIS_PASSWORD: ${_REDIS_PASSWORD}
      REDIS_USER: ${_REDIS_USER}
    ports:
      - "${_REDIS_BIND}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --user \"$$REDIS_USER\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    environment:
      DB_URL: ${_DB_URL}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./data/reference.jsonl.gz
        target: /app/data/reference.jsonl.gz
        read_only: true
        bind:
          create_host_path: false
    command: ["python", "-m", "pycil.app.migrate", "--reference", "/app/data/reference.jsonl.gz"]
    restart: "no"

  api:
    <<: *backend
    restart: unless-stopped
    stop_grace_period: 120s
    environment: *runtime-env
    volumes:
      - search:/var/lib/pycil/search
    ports:
      - "${API_HOST_PORT:-127.0.0.1:8000}:8000"
    depends_on: *stores-ready
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz').read()"]
      interval: 10s
      timeout: 5s
      retries: 6

  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  search:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
