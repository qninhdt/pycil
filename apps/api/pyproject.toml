[project]
name = "pycil-api"
version = "1.0.0"
description = "Subscription vocabulary learning"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.142.2",
  "uvicorn[standard]>=0.54.0",
  "sqlalchemy[asyncio]>=2.1.3",
  "alembic>=1.20.0",
  "asyncpg>=0.31.0",
  "redis>=8.1.0",
  "pydantic>=2.13.5",
  "pyjwt[crypto]>=2.15.1",
  "httpx>=0.28.1",
  "pyyaml>=6.0.3",
  "orjson>=3.12.0,<4",
  "fsrs-rs-python==0.9.3",
  "langchain>=1.4.3",
  "langgraph-checkpoint-postgres>=3.1.2",
  "psycopg[binary,pool]>=3.3.6",
  "ag-ui-protocol>=1.0.0",
  "ag-ui-langgraph>=0.0.46",
  "langchain-openrouter>=0.2.9",
  "openrouter>=0.10.8",
  "structlog>=26.1.0",
  "opentelemetry-api==1.45.0",
  "opentelemetry-sdk==1.45.0",
  "opentelemetry-semantic-conventions==0.66b0",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",
  "opentelemetry-exporter-http-transport[urllib3]==0.66b0",
  "opentelemetry-exporter-otlp-common==0.66b0",
  "opentelemetry-instrumentation-asgi==0.66b0",
  "opentelemetry-instrumentation==0.66b0",
  "opentelemetry-util-http==0.66b0",
  "cachetools>=7.2.0,<8",
  "tantivy>=0.26.2,<0.27",
  "jinja2>=3.1.6",
  "openai>=3.0.0,<3.24.0",
  "instructor @ git+https://github.com/567-labs/instructor.git",
  "tenacity>=9.1.2",
  "jsonpatch>=1.33,<2",
  "taskiq[opentelemetry]==0.13.0",
  # shortcut: idle-queue crash recovery is deferred; re-enable its test after an upstream fix.
  "taskiq-redis==1.2.4",
  "wn>=0.10.0",
]

[tool.uv]
# Stable OTel packages require explicitly pinned companion betas.
prerelease = "explicit"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "filelock>=3.17.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.6.1",
    "ruff>=0.16.10",
    "testcontainers[postgres,redis]>=4.14.2",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pycil*"]

[tool.setuptools.package-data]
"pycil.assistant" = ["prompts/*.txt"]
"pycil.vocabulary" = ["prompts/*.jinja"]
"pycil.vocabulary.generation" = ["prompts/*.jinja"]
"pycil.themes" = ["prompts/*.jinja"]
"pycil.study.artifacts" = ["prompts/*.jinja", "prompts/types/*.jinja"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
addopts = "--import-mode=importlib"
markers = [
    "xdist_group: mark test to run in a specific xdist group",
]

[tool.coverage.run]
source = ["pycil"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "taskiq.TaskiqDepends"]
