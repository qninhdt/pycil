[project]
name = "pycil-api"
version = "1.0.0"
description = "Subscription vocabulary learning with native Lexi content"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.142.2", "uvicorn[standard]>=0.54.0", "sqlalchemy[asyncio]>=2.1.3",
  "alembic>=1.20.0", "asyncpg>=0.31.0", "redis>=8.1.0", "pydantic>=2.13.5",
  "pyjwt[crypto]>=2.15.1", "httpx>=0.28.1", "pyyaml>=6.0.3", "orjson>=3.12.0,<4", "lexi-ai",
  "fsrs-rs-python==0.9.3", "langchain>=1.4.3", "langchain-openai>=1.6.7",
  "langgraph-checkpoint-postgres>=3.1.2", "psycopg[binary,pool]>=3.3.6",
  "ag-ui-protocol>=1.0.0", "ag-ui-langgraph>=0.0.46",
]

[tool.uv]
prerelease = "disallow"

[tool.uv.sources]
lexi-ai = { path = "../../vendor/lexi-ai/lexi_ai-0.1.0+pycil.20261002-py3-none-any.whl" }

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.16.10"]

[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pycil*"]

[tool.setuptools.package-data]
"pycil.assistant" = ["prompt.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
