[project]
name = "pycil-worker"
version = "0.1.0"
description = "Pycil arq worker — three thin jobs delegating to lexi-ai + Centrifugo publish."
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26,<0.27",
    "redis>=5.2,<6.0",
    "asyncpg>=0.30,<0.31",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<2.7",
    "structlog>=24.4,<25.0",
    "httpx>=0.28,<0.29",
    "sqlalchemy>=2.0,<2.1",
    "sqlmodel>=0.0.38,<0.1",
    "pycil-shared",
    "pycil-api",
    # lexi-ai, pinned to an immutable commit (never a movable tag). MUST match
    # apps/api — the two deploy together against one database and one schema.
    "lexi-ai @ git+https://github.com/qninhdt/lexi-ai.git@acb76d6163f96bcc7eeece239816732bbd856d73",
]

[tool.uv.sources]
pycil-shared = { path = "../../packages/shared-py", editable = true }
pycil-api = { path = "../api", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-postgresql>=6.1,<7.0",
    "fakeredis[lua]>=2.26,<3.0",
    "freezegun>=1.5,<2.0",
    "pytest-mock>=3.14,<4.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pycil_worker*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
