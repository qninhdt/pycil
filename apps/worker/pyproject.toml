[project]
name = "pycil-worker"
version = "0.1.0"
description = "Pycil domain worker — durable Redis Streams jobs delegating to lexi-ai."
requires-python = ">=3.12"
dependencies = [
    "redis>=6,<7",
    "taskiq>=0.12,<0.13",
    "taskiq-redis>=1.1,<2",
    "asyncpg>=0.30,<0.31",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<2.7",
    "structlog>=24.4,<25.0",
    "httpx>=0.28,<0.29",
    "sqlalchemy>=2.0,<2.1",
    "sqlmodel>=0.0.38,<0.1",
    # Lexi arrives THROUGH pycil-api, deliberately unpinned here. The worker used to
    # pin it too, and the two drifted through a Lexi bump: one build in the API, an
    # older one in the worker, against one database and one migrated schema. Nothing
    # caught it, because each app's suite installs only its own pin. One pin makes
    # that impossible instead of detectable.
    "pycil-api",
]

[tool.uv.sources]
pycil-api = { path = "../api", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-postgresql>=6.1,<7.0",
    "fakeredis[lua]>=2.26,<3.0",
    "freezegun>=1.5,<2.0",
    "pytest-mock>=3.14,<4.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<0.9",
    "import-linter>=2.1,<3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Floor set to the value measured 2026-08-06, not to an aspiration. Above the
# current level it blocks unrelated work; below it, the gate can be satisfied by
# deleting tests. Raise it when coverage genuinely improves.
# Coverage is measured on every run but gated only where a whole-suite number is
# meaningful. `--cov-fail-under` here would apply to a single-file run too, so
# `pytest tests/one_file.py` reports failure with every test passing — which
# teaches people to pass `--no-cov`, and then the gate protects nothing. The
# threshold lives in `scripts/verify-baseline.sh` and CI, which run the full suite.
addopts = "--cov=pycil_worker"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pycil_worker*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

# --- import boundaries -------------------------------------------------------
#
# The worker is thin by design: jobs delegate to the api package and to lexi-ai.
# The contract that matters is the direction of that dependency — the api must
# never reach back into the worker, or a request-path import would drag taskiq
# and the job registry into the web process.
#
[tool.importlinter]
root_package = "pycil_worker"
include_external_packages = true

# Jobs are the only place allowed to touch taskiq. Everything else is library
# code that must stay callable from a test without a broker.
[[tool.importlinter.contracts]]
name = "only the worker entrypoint and jobs know about taskiq"
type = "forbidden"
source_modules = ["pycil_worker.lexi_library"]
forbidden_modules = ["taskiq"]
