[project]
name = "pycil-worker"
version = "0.1.0"
description = "Pycil arq worker — three thin jobs delegating to lexi-ai + Centrifugo publish."
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26,<0.27",
    "redis>=5.2,<6.0",
    "asyncpg>=0.30,<0.31",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<2.7",
    "structlog>=24.4,<25.0",
    "httpx>=0.28,<0.29",
    "sqlalchemy>=2.0,<2.1",
    "sqlmodel>=0.0.38,<0.1",
    "pycil-shared",
    "pycil-api",
    # lexi-ai v0.2.1; immutable release commit.
    "lexi-ai @ git+https://github.com/qninhdt/lexi-ai.git@c0ad25217b36ad9fdade9cff5aef18cefee761f4",
]

[tool.uv.sources]
pycil-shared = { path = "../../packages/shared-py", editable = true }
pycil-api = { path = "../api", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-postgresql>=6.1,<7.0",
    "fakeredis[lua]>=2.26,<3.0",
    "freezegun>=1.5,<2.0",
    "pytest-mock>=3.14,<4.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<0.9",
    "import-linter==2.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pycil_worker*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]


# Import Linter enforces module-level Lexi boundaries. Symbol-level root imports,
# dynamic imports, and private attribute access are covered by the API AST contract test.
[tool.importlinter]
root_packages = ["pycil_worker", "lexi_ai"]

[[tool.importlinter.contracts]]
name = "worker imports only the public Lexi modules"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["pycil_worker"]
forbidden_modules = [
    "lexi_ai.api",
    "lexi_ai.application",
    "lexi_ai.db",
    "lexi_ai.domain",
    "lexi_ai.facades",
    "lexi_ai.infrastructure",
    "lexi_ai.models",
    "lexi_ai.persistence",
    "lexi_ai.questions",
]
