[project]
name = "pycil-worker"
version = "0.1.0"
description = "Pycil background worker — arq + LangChain + OpenRouter"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26,<0.27",
    "redis>=5.2,<6.0",
    "asyncpg>=0.30,<0.31",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<2.7",
    "structlog>=24.4,<25.0",
    "httpx>=0.28,<0.29",
    "langchain>=0.3.7,<0.4",
    "langchain-openai>=0.2.8,<0.3",
    "jinja2>=3.1,<4.0",
    "sqlalchemy>=2.0,<2.1",
    "sqlmodel>=0.0.38,<0.1",
    "pycil-shared",
]

[tool.uv.sources]
pycil-shared = { path = "../../packages/shared-py", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-postgresql>=6.1,<7.0",
    "fakeredis[lua]>=2.26,<3.0",
    "freezegun>=1.5,<2.0",
    "pytest-mock>=3.14,<4.0",
    "pytest-cov>=6.0,<7.0",
    "alembic>=1.14,<1.15",
    "ruff>=0.8,<0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure-logic tests, no I/O and no network (exception classification, fallback hops with fake clients).",
    "llm_live: real OpenRouter contract tests. Skipped unless RUN_LLM_LIVE=1 (costs money, needs OPENROUTER_API_KEY).",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]
