[project]
name = "pycil-shared"
version = "0.1.0"
description = "Shared Python logic: FSRS engine, Centrifugo channel/payload builders."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<0.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["shared/fsrs/tests", "shared/tasks/tests"]
# Floor set to the value measured 2026-08-06, not to an aspiration. A gate above
# the current level blocks every unrelated change; a gate below it can be met by
# deleting tests. Raise it deliberately when coverage genuinely improves.
#
# The 78% (78.72 measured) is honest about a real gap rather than hiding it: shared/realtime/
# (channels.py, payloads.py) sits at 0% because testpaths only reaches
# shared/fsrs/tests and shared/tasks/tests. That is a test gap to close, not a
# number to tune away.
# Coverage is measured on every run but gated only where a whole-suite number is
# meaningful. `--cov-fail-under` here would apply to a single-file run too, so
# `pytest tests/one_file.py` reports failure with every test passing — which
# teaches people to pass `--no-cov`, and then the gate protects nothing. The
# threshold lives in `scripts/verify-baseline.sh` and CI, which run the full suite.
addopts = "--cov=shared"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
