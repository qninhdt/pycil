[project]
name = "pycil-shared"
version = "0.1.0"
description = "Shared Python types: question ABC + MCQ subclass."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3.0",
    "sqlmodel>=0.0.38,<0.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*"]
